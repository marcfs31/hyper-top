name: Bug report
description: Report a reproducible problem with hyper-top.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, hyper-top version, and installation method.
      placeholder: "macOS 15, hyper-top 0.8.0, cargo install"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the smallest steps that reproduce the problem.
    validations:
      required: true

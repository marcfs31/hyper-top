[package]
name = "hyper-top"
version = "0.9.3"
description = "Terminal-based system monitor and process dashboard"
license = "MIT"
edition = "2021"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1.38", features = ["full"] }
sysinfo = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

[workspace]
